name: Build & deploy blog

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, closed] # closed drives the preview cleanup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  # never cancel a running publish of master, only superseded PR builds
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Runs all the code of the PR with a read-only token; the publishing jobs below only copy its output.
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6   # the version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types of code and content
        run: pnpm check

      - name: Unit tests, including the Polish/English pairing of posts
        run: pnpm test

      - name: Build the site to publish
        if: github.event_name != 'pull_request'
        run: pnpm build

      # the same site under its own prefix; dist stays at dist/ root, publish-pages nests it below preview/pr-N/
      - name: Build the PR preview under its own prefix
        if: github.event_name == 'pull_request'
        env:
          SITE_BASE: /preview/pr-${{ github.event.pull_request.number }}
        run: pnpm build

      - name: Check the preview contract under the prefix
        if: github.event_name == 'pull_request'
        run: node scripts/test-preview-build.mjs dist "/preview/pr-${{ github.event.pull_request.number }}"

      - name: Post share and translation links
        if: github.event_name != 'pull_request'
        run: node scripts/test-post-links.mjs

      - name: Polish letters inside the web fonts
        run: node scripts/test-font-coverage.mjs

      # the scripts that publish with a write token after the merge: better to find out here that they are broken
      - name: Test the publish script
        run: ./scripts/test-publish-pages

      - name: Check the workflow trust
        run: node scripts/test-workflow-trust.mjs

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload the PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Every commit that lands on master is published: the built site goes to the root of the gh-pages branch, which
  # GitHub Pages serves at https://droga.ww86.eu. GITHUB_TOKEN only, no secrets; contents: write on this job only.
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-publish-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Publish to gh-pages
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: src/scripts/publish-pages pages site site

  # Copies the verified preview artifact of a PR below preview/pr-<N>/ on gh-pages. Nothing from the PR runs here:
  # the publishing script comes from a checkout of the literal master branch (the repo's default branch is gh-pages,
  # so a default checkout would fetch the published site, not the code), and the artifact is only ever copied by
  # that script, never executed. Fork PRs and Dependabot get no write job at all; same for the cleanup below.
  preview-publish:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true # a newer push to the same PR supersedes this preview
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          path: src
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v8
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: site
      - name: Publish the preview
        env:
          SOURCE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: src/scripts/publish-pages pages preview "$PR_NUMBER" site

  # A closed PR (merged or not) loses its preview; production, CNAME and the other previews stay.
  preview-remove:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true # a close supersedes a publish that is still running for this PR
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          path: src
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - name: Remove the preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: src/scripts/publish-pages pages remove "$PR_NUMBER"
